<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Piggo Electric Course</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Jost:wght@200;300;400;500&display=swap">
<style>
/* Layout concept: a dark showroom. One persistent 3D stage with hairline UI around it; lessons and games borrow the stage or take the whole page. */
:root{
  --bg:#08090b; --bg2:#0e1013; --bg3:#15181d;
  --fg:#eceef1; --mut:#8c939e; --dim:#5a616b;
  --line:rgba(255,255,255,.11); --line2:rgba(255,255,255,.2);
  --accent:#ff9a1f; --accent-soft:rgba(255,154,31,.14);
  --paint:#4d86d0; --ok:#5fd08a; --bad:#ff6a5e;
  --display:'Jost','Futura','Century Gothic',sans-serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --top:58px; --side:410px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--body);display:flex;flex-direction:column;overflow-x:hidden;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.display{font-family:var(--display);font-weight:300;text-transform:uppercase;letter-spacing:.14em}

/* top bar */
.top{height:var(--top);flex:none;display:flex;align-items:center;gap:24px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg);position:relative;z-index:20}
.logo{font:300 20px/1 var(--display);letter-spacing:.42em;text-transform:uppercase;padding-left:.2em}
.logo b{font-weight:500;color:var(--paint)}
.nav{display:flex;gap:4px;margin-left:12px;min-width:0}
.nav a{font:400 12px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--mut);text-decoration:none;padding:10px 14px;border-bottom:1px solid transparent;white-space:nowrap}
.nav a:hover{color:var(--fg)}
.nav a[aria-current=page]{color:var(--fg);border-bottom-color:var(--accent)}
.xpchip{margin-left:auto;display:flex;align-items:center;gap:10px;font:500 11px/1 var(--mono);letter-spacing:.1em;color:var(--mut);white-space:nowrap}
.xpchip .bar{width:70px;height:2px;background:var(--line2);position:relative}
.xpchip .bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);width:0;transition:width .6s}
.xpchip strong{color:var(--fg);font-weight:500}

/* app */
#app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--side);grid-template-rows:minmax(0,1fr)}
#app[data-view=page]{display:block;overflow-y:auto}
#app[data-view=page] #stageWrap,#app[data-view=page] #side{display:none}
#app:not([data-view=page]) #page{display:none}
#stageWrap{position:relative;min-width:0;min-height:0;background:radial-gradient(120% 90% at 50% 38%,#151a22 0%,#0a0c10 55%,#08090b 100%);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#side{border-left:1px solid var(--line);background:var(--bg);overflow-y:auto;min-height:0;display:flex;flex-direction:column}
.pad{padding:28px 28px 36px}

/* hero overlay */
.hero{position:absolute;left:clamp(20px,4vw,56px);top:clamp(20px,5vh,56px);z-index:3;pointer-events:none;max-width:min(560px,70%);transition:opacity .5s,transform .5s}
.hero.off{opacity:0;transform:translateY(-10px)}
.hero h1{font:200 clamp(54px,9vw,128px)/.95 var(--display);letter-spacing:.18em;text-transform:uppercase;margin:16px 0 18px -.04em}
.hero p{color:var(--mut);max-width:34ch;font-size:15px}
.hero .cta{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap;pointer-events:auto}
.btn{display:inline-flex;align-items:center;gap:10px;font:400 12px/1 var(--display);letter-spacing:.22em;text-transform:uppercase;padding:15px 22px;border:1px solid var(--line2);color:var(--fg);text-decoration:none;transition:background .2s,color .2s,border-color .2s}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.pri:hover{background:transparent;color:var(--fg)}
.btn.sm{padding:11px 16px;font-size:11px}
.btn[disabled]{opacity:.35;pointer-events:none}

/* stage controls */
.modes{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:4;display:flex;border:1px solid var(--line2);background:rgba(8,9,11,.72);backdrop-filter:blur(8px)}
.modes button{white-space:nowrap;font:400 11px/1 var(--display);letter-spacing:.22em;text-transform:uppercase;padding:13px 18px;color:var(--mut);transition:color .2s,background .2s}
.modes button:hover{color:var(--fg)}
.modes button[aria-pressed=true]{color:var(--bg);background:var(--fg)}
.modes button[data-m=xray][aria-pressed=true]{background:var(--accent)}
.reset{position:absolute;right:18px;bottom:22px;z-index:4;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding:12px 4px}
.reset:hover{color:var(--fg)}
.hint{position:absolute;left:clamp(20px,4vw,56px);bottom:26px;z-index:3;font:500 11px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);pointer-events:none}
#hot{position:absolute;inset:0;z-index:3;pointer-events:none}
.dot{position:absolute;left:0;top:0;width:28px;height:28px;margin:-14px 0 0 -14px;pointer-events:auto;display:grid;place-items:center;opacity:0;transition:opacity .3s}
.dot.on{opacity:1}
.dot::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--fg);box-shadow:0 0 0 4px rgba(255,255,255,.14);transition:transform .2s,background .2s}
.dot.hid::before{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.dot:hover::before,.dot.sel::before{transform:scale(1.5)}
.dot.sel::before{background:var(--accent)}
.dot .lbl{position:absolute;left:22px;top:50%;transform:translateY(-50%);white-space:nowrap;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;background:rgba(8,9,11,.85);padding:6px 9px;border:1px solid var(--line2);opacity:0;pointer-events:none;transition:opacity .15s}
.dot:hover .lbl,.dot.sel .lbl,.dot.tip .lbl{opacity:1}

/* side content */
.sec-title{font:300 26px/1.15 var(--display);letter-spacing:.1em;text-transform:uppercase;margin:10px 0 8px}
.lead{color:var(--mut);font-size:14px}
.group{margin-top:28px}
.group h3{font:500 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--mut);padding-bottom:12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.group h3 span:last-child{color:var(--accent)}
.plist{list-style:none;margin:0;padding:0}
.plist button{width:100%;display:grid;grid-template-columns:28px 1fr auto;align-items:baseline;gap:6px;text-align:left;padding:13px 2px;border-bottom:1px solid var(--line);transition:padding .2s,color .2s}
.plist button:hover{padding-left:8px}
.plist .n{font:500 11px/1 var(--mono);color:var(--dim)}
.plist .t{font:400 14px/1.3 var(--body)}
.plist .s{font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.plist button.hover{color:var(--accent)}
.back{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);display:flex;width:max-content;gap:8px;padding:4px 0 18px;text-decoration:none}
.back:hover{color:var(--fg)}
.sys{display:inline-block;font:500 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;padding:6px 8px;border:1px solid var(--line2);color:var(--mut);margin-bottom:14px}
.sys.hid{border-color:var(--accent);color:var(--accent)}
.detail h2{font:300 32px/1.1 var(--display);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.detail .short{font-size:16px;color:var(--fg);margin-bottom:22px}
.detail h4{font:500 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin:26px 0 10px;padding-top:18px;border-top:1px solid var(--line)}
.detail p{color:#c4c9d1;max-width:60ch}
.detail ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.detail li{color:#c4c9d1;padding-left:18px;position:relative}
.detail li::before{content:"";position:absolute;left:0;top:.7em;width:8px;height:1px;background:var(--accent)}
dl.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:0}
dl.facts dt,dl.facts dd{margin:0;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
dl.facts dt{font:500 11px/1.6 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding-right:18px}
dl.facts dd{text-align:right}
.watch{margin-top:24px;padding:14px 16px;background:var(--accent-soft);border-left:2px solid var(--accent);font-size:13px;color:var(--fg)}
.watch b{display:block;font:500 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}

/* lesson */
.steps{display:flex;gap:6px;margin:6px 0 24px}
.steps i{flex:1;height:2px;background:var(--line2)}
.steps i.on{background:var(--accent)}
.steps i.done{background:var(--fg)}
.lesson h2{font:300 28px/1.15 var(--display);letter-spacing:.09em;text-transform:uppercase;margin-bottom:16px}
.lesson p{color:#c4c9d1;margin-bottom:14px;max-width:56ch}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.chip{font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:7px 9px;border:1px solid var(--line2);color:var(--mut)}
.chip.hid{border-color:var(--accent);color:var(--accent)}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:32px}

/* quiz */
.qwrap{max-width:62ch}
.q{font:300 22px/1.35 var(--display);letter-spacing:.04em;margin:14px 0 22px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:14px;text-align:left;padding:15px 16px;border:1px solid var(--line2);transition:border-color .2s,background .2s;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--fg);background:var(--bg3)}
.opt .k{font:500 11px/1.7 var(--mono);color:var(--dim)}
.opt.right{border-color:var(--ok);background:rgba(95,208,138,.1)}
.opt.wrong{border-color:var(--bad);background:rgba(255,106,94,.1)}
.why{margin-top:16px;color:var(--mut);font-size:14px;min-height:3em}

/* pages */
#page{min-height:100%}
.wrap{max-width:1180px;margin:0 auto;padding:clamp(28px,6vw,64px) max(16px,env(safe-area-inset-left,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
.page-head{display:grid;gap:12px;margin-bottom:44px;max-width:60ch}
.page-head h1{font:200 clamp(38px,6vw,72px)/1 var(--display);letter-spacing:.14em;text-transform:uppercase}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.card{background:var(--bg);padding:26px 24px 24px;display:flex;flex-direction:column;gap:12px;text-align:left;min-width:0;transition:background .25s;position:relative}
.card:hover{background:var(--bg2)}
.card .no{font:500 11px/1 var(--mono);letter-spacing:.16em;color:var(--dim)}
.card h3{font:300 21px/1.2 var(--display);letter-spacing:.09em;text-transform:uppercase}
.card p{color:var(--mut);font-size:14px;flex:1}
.card .meta{display:flex;justify-content:space-between;align-items:center;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding-top:14px;border-top:1px solid var(--line)}
.card .meta .ok{color:var(--ok)}
.card .meta .go{color:var(--accent)}

/* games */
.gwrap{max-width:760px;margin:0 auto;padding:clamp(24px,5vw,56px) max(16px,env(safe-area-inset-left,0px)) 80px}
.hud{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:26px;flex-wrap:wrap}
.hud b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.timer{height:2px;background:var(--line2);margin:-27px 0 26px;position:relative}
.timer i{position:absolute;inset:0 auto 0 0;background:var(--accent);width:100%}
.big{font:200 clamp(56px,12vw,120px)/1 var(--display);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.res{display:grid;gap:18px;justify-items:start}
.res .stat{display:flex;gap:30px;flex-wrap:wrap}
.res .stat div{display:grid;gap:6px}
.res .stat span{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.res .stat b{font:300 28px/1 var(--display);letter-spacing:.06em}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mgrid .col{display:grid;gap:8px;align-content:start}
.tile{padding:14px 14px;border:1px solid var(--line2);text-align:left;font-size:14px;line-height:1.35;min-height:56px;display:flex;align-items:center;transition:border-color .2s,background .2s,opacity .3s}
.tile:hover:not([disabled]){border-color:var(--fg)}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}
.tile.done{border-color:var(--ok);background:rgba(95,208,138,.08);opacity:.55;pointer-events:none}
.tile.shake,.opt.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pathlist{display:grid;gap:8px;margin-top:22px}
.slot{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:baseline;padding:13px 14px;border:1px dashed var(--line2);min-height:58px;color:var(--dim);font:500 11px/1.5 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.slot.filled{border:1px solid var(--ok);color:var(--fg);background:rgba(95,208,138,.07);text-transform:none;font:400 14px/1.4 var(--body)}
.slot.filled b{display:block;font:400 14px/1.4 var(--display);letter-spacing:.14em;text-transform:uppercase}
.slot.filled span{color:var(--mut);font-size:13px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:12px 18px;font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;opacity:0;pointer-events:none;transition:.3s;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}
.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:6;background:var(--bg);transition:opacity .6s}
.loading.off{opacity:0;pointer-events:none}
.loading span{font:300 13px/1 var(--display);letter-spacing:.5em;text-transform:uppercase;color:var(--mut);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.banner{position:absolute;left:50%;top:18px;transform:translateX(-50%);z-index:5;font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:10px 14px;background:rgba(8,9,11,.85);border:1px solid var(--line2);opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.banner.on{opacity:1}
.banner.ok{border-color:var(--ok);color:var(--ok)}
.banner.bad{border-color:var(--bad);color:var(--bad)}
.lvl{display:grid;gap:10px;margin:0 0 40px}
.lvl .bigbar{height:3px;background:var(--line2);position:relative}
.lvl .bigbar i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:13px 8px;border-bottom:1px solid var(--line);text-align:left}
table.t th{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.tscroll{overflow-x:auto}

@media (max-width:860px){
  :root{--top:54px}
  .top{gap:10px}
  .logo{font-size:15px;letter-spacing:.3em}
  .nav{margin-left:0;overflow-x:auto;scrollbar-width:none;flex:1}
  .nav a{padding:10px 8px;font-size:11px;letter-spacing:.14em}
  .xpchip .bar,.xpchip .lvlname{display:none}
  #app:not([data-view=page]){display:block;overflow-y:auto}
  #stageWrap{height:min(50svh,430px);position:sticky;top:0;z-index:5}
  #side{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .pad{padding:22px 16px 40px}
  .hero{max-width:90%;top:16px}
  .hero h1{font-size:clamp(40px,13vw,64px);margin:12px 0 0 -.04em}
  .hero p,.hero .cta{display:none}
  .hint{display:none}
  .modes{bottom:14px}
  .modes button{padding:12px 11px;letter-spacing:.12em}
  .reset{display:none}
  .mgrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top">
  <a class="logo" href="#explore" style="color:inherit;text-decoration:none">PIGG<b>O</b></a>
  <nav class="nav" id="nav" aria-label="Sections">
    <a href="#explore" data-k="explore">Explore</a>
    <a href="#course" data-k="course">Course</a>
    <a href="#games" data-k="games">Games</a>
    <a href="#progress" data-k="progress">Progress</a>
  </nav>
  <div class="xpchip" aria-live="polite"><span class="lvlname" id="lvlName">Rider</span><div class="bar"><i id="xpBar"></i></div><span><strong id="xpNum">0</strong> XP</span></div>
</header>

<div id="app" data-view="explore">
  <div id="stageWrap">
    <canvas id="cv" aria-label="Interactive 3D model of the Piggo electric motorbike. Drag to rotate, scroll to zoom."></canvas>
    <div class="loading" id="loading"><span>Loading Piggo</span></div>
    <div class="hero" id="hero">
      <div class="eyebrow">Electric motorbike course</div>
      <h1>Piggo</h1>
      <p>Spin it. Tap a part. Switch to x-ray to see the battery, motor and controller.</p>
      <div class="cta"><a class="btn pri" href="#lesson-m1">Start the course</a><a class="btn" href="#games">Play games</a></div>
    </div>
    <div class="banner" id="banner"></div>
    <div id="hot"></div>
    <div class="hint" id="hint">Drag to rotate &nbsp;&middot;&nbsp; Scroll to zoom</div>
    <div class="modes" id="modes" role="group" aria-label="View mode">
      <button data-m="solid" aria-pressed="true">Solid</button>
      <button data-m="xray" aria-pressed="false">X-ray</button>
      <button data-m="explode" aria-pressed="false">Exploded</button>
    </div>
    <button class="reset" id="reset">Reset view</button>
  </div>
  <aside id="side" aria-live="polite"></aside>
  <main id="page"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script type="module" src="./js/app.js"></script>

</body></html>
